# yamllint disable rule:line-length
name: Release

on:
  push:
    branches: [main]
    paths: [custom_components/actronair_neo/manifest.json]
    tags: ["[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve source and version
        id: resolve
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          CREATE_TAG=false
          SHOULD_RELEASE=true
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/actronair_neo/manifest.json"))["version"])')
          fi
          git check-ref-format "refs/tags/$VERSION"
          REMOTE=$(git ls-remote --tags origin "refs/tags/$VERSION" "refs/tags/$VERSION^{}")
          TAG_SHA=$(awk '$2 !~ /\^\{\}$/ {print $1}' <<< "$REMOTE")
          PEELED=$(awk '$2 ~ /\^\{\}$/ {print $1}' <<< "$REMOTE")
          TAG_SHA=${PEELED:-$TAG_SHA}
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            if [[ -z "$TAG_SHA" ]]; then
              CREATE_TAG=true
            elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
              SHOULD_RELEASE=false
              echo "Tag $VERSION already exists; skipping manifest push." >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$TAG_SHA" != "$SHA" ]]; then
              echo "Tag $VERSION points to a different commit; refusing to release."
              exit 1
            fi
          elif [[ "$TAG_SHA" != "$SHA" ]]; then
            echo "Tag no longer matches the checked-out commit."
            exit 1
          fi
          PRERELEASE=false
          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then PRERELEASE=true; fi
          {
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "prerelease=$PRERELEASE"
            echo "create_tag=$CREATE_TAG"
            echo "should_release=$SHOULD_RELEASE"
          } >> "$GITHUB_OUTPUT"
      - name: Set up uv
        if: steps.resolve.outputs.should_release == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build release
        if: steps.resolve.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SOURCE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$SOURCE_SHA")
          export SOURCE_DATE_EPOCH
          uv run --no-project script/build_release.py --tag "$VERSION"
      - name: Prepare release notes
        if: steps.resolve.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['VERSION']
          changelog = Path('CHANGELOG.md').read_text()
          heading = f'## [{version}]'
          notes = ''
          for section in changelog.split('\n## '):
              if ('## ' + section).startswith(heading):
                  notes = section.split('\n', 1)[1].strip()
                  break
          notes = notes or f'Release {version} of the ActronAir Neo integration.'
          checksum = Path('dist/SHA256SUMS').read_text().strip()
          repository = os.environ['GITHUB_REPOSITORY']
          notes += f'''

          ## Installation

          In HACS or the Marketplace, download ActronAir Neo and restart Home Assistant.
          For manual installation, extract `actronair_neo.zip` into
          `config/custom_components/actronair_neo/` and restart Home Assistant.
          The ZIP contains files at its root. Older releases without this fixed-name
          asset may fail to download when selected in HACS or the Marketplace.

          ## Verify the download

          Download `SHA256SUMS` alongside the ZIP, then run:

          ```sh
          sha256sum -c SHA256SUMS
          gh attestation verify actronair_neo.zip --repo {repository}
          gh release verify-asset {version} actronair_neo.zip --repo {repository}
          ```

          Release verification requires GitHub CLI 2.81.0 or later.

          ```text
          {checksum}
          ```
          '''
          Path('dist/RELEASE_NOTES.md').write_text(notes + '\n')
          Path('dist/CHANGELOG.md').write_text(changelog)
          PY
      - name: Attest build provenance
        if: steps.resolve.outputs.should_release == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/actronair_neo.zip
      - name: Upload release files
        if: steps.resolve.outputs.should_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify and publish
    needs: build
    if: needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
      CREATE_TAG: ${{ needs.build.outputs.create_tag }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Require a recent GitHub CLI
        run: |
          VERSION_INSTALLED=$(gh --version | head -1 | awk '{print $3}')
          dpkg --compare-versions "$VERSION_INSTALLED" ge 2.81.0 || {
            echo 'GitHub CLI 2.81.0 or later is required.'
            exit 1
          }
      - name: Verify checksum and provenance
        run: |
          sha256sum -c SHA256SUMS
          gh attestation verify actronair_neo.zip --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-digest "$SOURCE_SHA"
      - name: Create and verify annotated tag
        run: |
          set -euo pipefail
          TAG_PATH=$(jq -rn --arg tag "$VERSION" '$tag | @uri')
          REF="repos/$GH_REPO/git/ref/tags/$TAG_PATH"
          if [[ "$CREATE_TAG" == true ]] && ! gh api "$REF" >/dev/null 2>&1; then
            TAG_OBJECT=$(gh api --method POST "repos/$GH_REPO/git/tags" \
              -f tag="$VERSION" -f message="Release $VERSION" \
              -f object="$SOURCE_SHA" -f type=commit --jq .sha)
            # A racing run may have created the ref; its target is checked below.
            if ! gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$VERSION" -f sha="$TAG_OBJECT"; then
              gh api "$REF" >/dev/null
            fi
          fi
          OBJECT=$(gh api "$REF" --jq .object)
          for _ in {1..10}; do
            TYPE=$(jq -r .type <<< "$OBJECT")
            TAG_SHA=$(jq -r .sha <<< "$OBJECT")
            if [[ "$TYPE" == commit ]]; then break; fi
            [[ "$TYPE" == tag ]] || exit 1
            OBJECT=$(gh api "repos/$GH_REPO/git/tags/$TAG_SHA" --jq .object)
          done
          [[ "$TYPE" == commit && "$TAG_SHA" == "$SOURCE_SHA" ]] || {
            echo 'Tag does not resolve to the attested source commit.'
            exit 1
          }
      - name: Replace stale draft and publish
        run: |
          set -euo pipefail
          RELEASES=$(gh release list --limit 1000 --json tagName,isDraft)
          STATE=$(jq -r --arg tag "$VERSION" '.[] | select(.tagName == $tag) | .isDraft' <<< "$RELEASES")
          if [[ "$STATE" == false ]]; then
            echo "Release $VERSION is already published and cannot be replaced."
            exit 1
          elif [[ "$STATE" == true ]]; then
            gh release delete "$VERSION" --yes
          fi
          FLAGS=()
          if [[ "$PRERELEASE" == true ]]; then FLAGS+=(--prerelease); fi
          gh release create "$VERSION" --draft --verify-tag --title "$VERSION" \
            --notes-file RELEASE_NOTES.md "${FLAGS[@]}" \
            actronair_neo.zip SHA256SUMS CHANGELOG.md
          gh release edit "$VERSION" --draft=false
      - name: Verify immutable release and asset
        run: |
          for attempt in {1..5}; do
            if gh release verify "$VERSION" && \
               gh release verify-asset "$VERSION" actronair_neo.zip; then
              echo "Verified release $VERSION and its ZIP." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then sleep 10; fi
          done
          echo 'Release verification failed. Enable release immutability before releasing.'
          exit 1
