name: HA Developer Blog

on:
  schedule:
    - cron: "30 5 * * 1"
      timezone: Australia/Brisbane
  workflow_dispatch:
    inputs:
      days:
        description: Number of days of posts to inspect
        type: number
        default: 7
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Scan recent posts
        env:
          DAYS: ${{ inputs.days || 7 }}
        run: >-
          uv run --no-project --with defusedxml --with beautifulsoup4
          script/ha-dev-blog/scan.py --days "$DAYS" --output blog-results.json
      - name: Upload scan evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-dev-blog
          path: blog-results.json
          if-no-files-found: error

  file-issues:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout trusted issue-filing script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download scan evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ha-dev-blog
      - name: File matching posts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 script/ha-dev-blog/file_issues.py blog-results.json
