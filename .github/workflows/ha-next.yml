# yamllint disable rule:line-length
name: HA Next

on:
  schedule:
    - cron: "0 5 * * 1"
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [pypi, dev]
    env:
      HA_NEXT_ENV: /tmp/ha-next-venv
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Resolve channel versions and test plugin
        id: resolve
        continue-on-error: true
        env:
          CHANNEL: ${{ matrix.channel }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project --with packaging script/ha-next/resolve_versions.py "$CHANNEL"
      - name: Install channel
        id: install
        continue-on-error: true
        env:
          HA_SPEC: ${{ steps.resolve.outputs.ha_spec }}
        run: |
          uv venv --python "$(cat .python-version)" "$HA_NEXT_ENV"
          test -n "$HA_SPEC"
          uv pip install --python "$HA_NEXT_ENV/bin/python" "$HA_SPEC" \
            'aiomqtt>=2.0.0' 'pydantic>=2.0.0' aiofiles
          uv pip install --python "$HA_NEXT_ENV/bin/python" --no-deps .
      - name: Import smoke check
        id: imports
        if: always()
        continue-on-error: true
        run: '"$HA_NEXT_ENV/bin/python" script/ha-next/import_check.py'
      - name: Hassfest for this channel
        id: hassfest
        if: always()
        continue-on-error: true
        env:
          CHANNEL: ${{ matrix.channel }}
          RESOLVED_VERSION: ${{ steps.resolve.outputs.ha_version }}
        run: |
          source "$HA_NEXT_ENV/bin/activate"
          if [[ "$CHANNEL" == dev ]]; then
            export HA_VERSION=dev
          else
            export HA_VERSION="$RESOLVED_VERSION"
            test -n "$HA_VERSION"
          fi
          script/hassfest
      - name: Tests with matching plugin
        id: tests
        if: steps.resolve.outputs.harness_spec != '' && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          HA_SPEC: ${{ steps.resolve.outputs.ha_spec }}
          HARNESS_SPEC: ${{ steps.resolve.outputs.harness_spec }}
        run: |
          # --no-sources: the project's [tool.uv.sources] Core pin must not
          # override this channel's plugin.
          uv pip install --python "$HA_NEXT_ENV/bin/python" --no-sources '.[test]' \
            "$HA_SPEC" "$HARNESS_SPEC"
          if uv pip show --python "$HA_NEXT_ENV/bin/python" pytest-homeassistant-custom-component >/dev/null 2>&1; then
            echo 'The retired pytest-homeassistant-custom-component is installed.' >&2
            exit 1
          fi
          source "$HA_NEXT_ENV/bin/activate"
          script/test
      - name: Explain skipped tests
        if: always() && steps.tests.outcome == 'skipped'
        env:
          HARNESS_SPEC: ${{ steps.resolve.outputs.harness_spec }}
          HARNESS_NOTE: ${{ steps.resolve.outputs.harness_note }}
        run: |
          if [[ -z "$HARNESS_SPEC" ]]; then
            echo "Pytest skipped: no test plugin source (${HARNESS_NOTE:-resolver failed})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Pytest skipped: channel installation failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record channel results
        if: always()
        env:
          CHANNEL: ${{ matrix.channel }}
          HA_VERSION: ${{ steps.imports.outputs.ha_version || steps.resolve.outputs.ha_version }}
          HARNESS_SOURCE: ${{ steps.resolve.outputs.harness_source }}
          HARNESS_SPEC: ${{ steps.resolve.outputs.harness_spec }}
          HARNESS_NOTE: ${{ steps.resolve.outputs.harness_note }}
          STEPS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          steps = json.loads(os.environ['STEPS'])
          outcomes = {name: steps.get(name, {}).get('outcome', 'missing')
                      for name in ('resolve', 'install', 'imports', 'hassfest', 'tests')}
          result = {'channel': os.environ['CHANNEL'], 'ha_version': os.environ['HA_VERSION'],
                    'harness_source': os.environ['HARNESS_SOURCE'],
                    'harness_spec': os.environ['HARNESS_SPEC'],
                    'harness_note': os.environ['HARNESS_NOTE'], 'outcomes': outcomes,
                    'run_url': os.environ['RUN_URL']}
          required = ['resolve', 'install', 'imports', 'hassfest']
          result['failed'] = any(outcomes[name] != 'success' for name in required) or outcomes['tests'] not in ('success', 'skipped')
          Path('result.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Upload channel results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-next-${{ matrix.channel }}
          path: result.json
          if-no-files-found: error
      - name: Fail this channel for failed checks
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.exit(int(json.loads(Path('result.json').read_text())['failed']))
          PY

  report:
    name: Report (${{ matrix.channel }})
    needs: check
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [pypi, dev]
    permissions:
      issues: write
    steps:
      - name: Download channel results
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ha-next-${{ matrix.channel }}
      - name: Update channel issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ matrix.channel }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$ARTIFACT_OUTCOME" != success ]]; then
            jq -n --arg channel "$CHANNEL" --arg url "$RUN_URL" \
              '{channel:$channel,failed:true,ha_version:"unknown",harness_source:"",harness_spec:"",harness_note:"channel results missing",outcomes:{artifact:"missing"},run_url:$url}' > result.json
          fi
          MARKER="<!-- ha-next-channel: $CHANNEL -->"
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --label ha-next --limit 1000 --json number,body \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .number" | head -1)
          VERSION=$(jq -r '.ha_version // "unknown"' result.json)
          {
            echo "$MARKER"
            echo "Home Assistant: $VERSION"
            echo "Test plugin: $(jq -r 'if (.harness_spec // "") == "" then "none" else "\(.harness_source): `\(.harness_spec)`" end' result.json)"
            NOTE=$(jq -r '.harness_note // ""' result.json)
            if [[ -n "$NOTE" ]]; then echo "Plugin note: $NOTE"; fi
            echo
            echo 'Check outcomes:'
            jq -r '.outcomes | to_entries[] | "- \(.key): \(.value)"' result.json
            echo
            echo "Run: $RUN_URL"
          } > body.md
          if [[ "$(jq -r .failed result.json)" == true ]]; then
            if [[ -z "$ISSUE" ]]; then
              LABELS=$(gh api --paginate "repos/$GH_REPO/labels?per_page=100" --jq '.[].name')
              if ! grep -qxF ha-next <<< "$LABELS"; then
                gh label create ha-next --color 0075ca --repo "$GH_REPO"
              fi
              if ! grep -qxF bug <<< "$LABELS"; then
                gh label create bug --color d73a4a --repo "$GH_REPO"
              fi
              gh issue create --repo "$GH_REPO" --title "HA Next ($CHANNEL): checks failed" \
                --label ha-next --label bug --body-file body.md
            else
              gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file body.md
              gh issue comment "$ISSUE" --repo "$GH_REPO" --body-file body.md
            fi
          elif [[ -n "$ISSUE" ]]; then
            gh issue comment "$ISSUE" --repo "$GH_REPO" --body-file body.md
            gh issue close "$ISSUE" --repo "$GH_REPO"
          fi
