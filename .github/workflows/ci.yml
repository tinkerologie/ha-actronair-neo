name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The repository tracks a .venv symlink for the dev container; keep CI's
  # environment outside the checkout.
  UV_PROJECT_ENVIRONMENT: /tmp/ci-venv

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked --all-extras --no-editable
      - name: Check formatting
        run: uv run --frozen --no-sync ruff format --check .

      - name: Lint
        run: uv run --frozen --no-sync ruff check --output-format=github .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked --all-extras --no-editable
      - name: Run tests
        run: uv run --frozen --no-sync pytest --cov=custom_components/actronair_neo --cov-report=term-missing

  package:
    name: Reproducible release ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build twice and compare
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          uv run --no-project script/build_release.py --output-dir dist/first
          uv run --no-project script/build_release.py --output-dir dist/second
          cmp dist/first/actronair_neo.zip dist/second/actronair_neo.zip
          cmp dist/first/SHA256SUMS dist/second/SHA256SUMS

  frontend:
    name: Dashboard cards
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Install frontend dependencies
        run: script/frontend install
      - name: Validate cards and committed bundle
        run: script/frontend check
      - name: Install browser test engine
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: script/frontend test:browser
