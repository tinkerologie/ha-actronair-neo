name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The repository tracks a .venv symlink for the dev container; keep CI's
  # environment outside the checkout.
  UV_PROJECT_ENVIRONMENT: /tmp/ci-venv

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked --all-extras --no-editable
      - name: Check formatting
        run: uv run --frozen --no-sync ruff format --check .

      - name: Lint
        run: uv run --frozen --no-sync ruff check --output-format=github .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked --all-extras --no-editable
      - name: Run tests
        run: uv run --frozen --no-sync pytest --cov=custom_components/actronair_neo --cov-report=term-missing
