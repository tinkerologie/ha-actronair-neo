# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2
updates:
  # ── Dev Containers ──────────────────────────────────────────────────
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      devcontainers-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # ── Python (uv) ────────────────────────────────────────────────────
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      production-minor-patch:
        patterns:
          - homeassistant
          - colorlog
        update-types:
          - minor
          - patch
      dev-minor-patch:
        patterns:
          - '*'
        exclude-patterns:
          - homeassistant
          - colorlog
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
      semver-major-days: 7

  # Dev container base image (.devcontainer/Dockerfile).
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      docker-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
