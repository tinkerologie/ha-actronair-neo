# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2
updates:
  # ── Dev Containers ──────────────────────────────────────────────────
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      devcontainers-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # ── Python (uv) ────────────────────────────────────────────────────
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      production-minor-patch:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
          - colorlog
        update-types:
          - minor
          - patch
      dev-minor-patch:
        patterns:
          - '*'
        exclude-patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
          - colorlog
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
      semver-major-days: 7
    # Packages pytest-homeassistant-custom-component pins exactly (==). Bumping one on
    # its own makes the lock unsatisfiable and fails the whole update run, so they
    # move only when pytest-homeassistant-custom-component does (STANDARDS.md §6).
    ignore:
      - dependency-name: freezegun
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-cov
      - dependency-name: pytest-timeout
      - dependency-name: pytest-xdist
      - dependency-name: respx
      - dependency-name: syrupy

  # Dev container base image (.devcontainer/Dockerfile).
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      docker-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
