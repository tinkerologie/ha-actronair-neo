# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2
updates:
  # ── Dev Containers ──────────────────────────────────────────────────
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      devcontainers-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Python (uv) ────────────────────────────────────────────────────
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      production-minor-patch:
        patterns:
          - colorlog
        update-types:
          - minor
          - patch
      dev-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - colorlog
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 3
      semver-major-days: 7
    # homeassistant is pinned exactly and moves only together with the
    # pytest-homeassistant Core commit in [tool.uv.sources]; Dependabot cannot
    # advance that Git revision, so maintainers update both by hand. The other
    # entries are packages pytest-homeassistant pins exactly (==): bumping one
    # on its own makes the lock unsatisfiable and fails the whole update run, so
    # they move only with the plugin (STANDARDS.md §6).
    ignore:
      - dependency-name: homeassistant
      - dependency-name: freezegun
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: pytest-freezer
      - dependency-name: pytest-xdist
      - dependency-name: respx
      - dependency-name: syrupy

  # Dev container base image (.devcontainer/Dockerfile).
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
